function newCoverage(){
  const c = {tag:{}, st:{}};
  MENU.forEach(m=>c.tag[m.t]=0);
  STRUCT.forEach(s=>c.st[s.k]=0);
  return c;
}
function coverScenario(cov, sc, delta){
  Object.keys(sc.tags).forEach(t=>cov.tag[t]+=delta);
  Object.keys(sc.struct).forEach(k=>cov.st[k]+=delta);
}
/* pick the dim with max posterior SE (uncertainty sampling); fallback: least-covered */
function probeTrial(sess){
  let dim = null;
  if (sess.fit){
    let bi = 0;
    for (let i=1;i<DIMS.length;i++) if (sess.fit.se[i] > sess.fit.se[bi]) bi = i;
    dim = DIMS[bi];
  } else {
    const cov = sess.cov;
    let cands = [];
    MENU.forEach(m=>{ if(m.c!=='config') cands.push({kind:m.c, key:m.t, cov:cov.tag[m.t]}); });
    CONFIGS.forEach(c=>cands.push({kind:'cfg', key:c, cov:cov.tag[c]}));
    STRUCT.forEach(s=>cands.push({kind:'st', key:s.k+':'+hotLevel(s.k), skey:s.k, lvl:hotLevel(s.k), cov:cov.st[s.k]}));
    cands.sort((a,b)=>a.cov-b.cov);
    const p = rnd(cands.filter(c=>c.cov===cands[0].cov));
    dim = p.kind==='st' ? {kind:'st', key:p.key, skey:p.skey, lvl:p.lvl, label:''} : p;
  }
  return trialForDim(sess, dim, 'probe');
}
function trialForDim(sess, dim, phase){
  let a, b, note;
  if (dim.kind==='cfg'){
    // matched: same acts/intensity/framing where coherent, config switched
    const base = (phase==='boundary') ? hotScenario() : genScenario();
    a = base;
    const acts = sampleActs(dim.key, Math.min(2, base.acts.length));
    const st = {};
    COHERENT[dim.key].forEach(k=>{ st[k] = base.struct[k]!==undefined ? base.struct[k] : hotLevel(k); });
    b = genScenario({config:dim.key, acts:acts, intl:base.intl, fram:base.fram,
      set:base.set, struct:st});
    note = phase+': config '+TAG[dim.key].label+' vs '+TAG[base.config].label+' (matched)';
  } else if (dim.kind==='st'){
    const k = dim.skey;
    let base = genScenario();
    if (!COHERENT[base.config].includes(k)) base = genScenario({config:'mmf'});
    const lo = coldLevel(k), hi = hotLevel(k);
    a = cloneScenario(base, {struct:{k:k, to:hi}});
    b = cloneScenario(base, {struct:{k:k, to:lo}});
    note = phase+': '+STRUCT[SIDX[k]].name+' '+STRUCT[SIDX[k]].lv[hi]+' vs '+STRUCT[SIDX[k]].lv[lo];
  } else {
    const base = genScenario();
    a = cloneScenario(base, {tag:dim.key});
    b = base;
    note = phase+': tag "'+TAG[dim.key].label+'" on vs off';
  }
  if (Math.random()<0.5){ const t=a; a=b; b=t; }
  return {phase:phase, a:a, b:b, note:note};
}
/* boundary: take the dimension with the biggest |weight|, bracket indifference */
function boundaryTrial(sess){
  const fit = sess.fit;
  let best = null;
  DIMS.forEach((d,i)=>{
    const w = fit.w[i], se = fit.se[i];
    const score = Math.abs(w);
    if (!best || score>best.score) best = {d:d, i:i, score:score, w:w, se:se};
  });
  const d = best.d;
  if (d.kind==='cfg'){
    // matched config switch inside a hot scenario (clone can't toggle configs)
    const t = trialForDim(sess, d, 'boundary');
    t.note = 'boundary: does "'+d.label+'" flip a hot scenario?';
    return t;
  }
  let a, b, note;
  if (d.kind==='act' || d.kind==='intl' || d.kind==='fram' || d.kind==='set'){
    const base = hotScenario();
    a = cloneScenario(base, {tag:d.key});
    b = base;
    note = 'boundary: does "'+d.label+'" flip a hot scenario?';
  } else {
    const k = d.skey, base = hotScenario();
    if (!COHERENT[base.config].includes(k)){ const b2 = hotScenario('mmf'); a = b2; b = cloneScenario(b2,{struct:{k:k,to:coldLevel(k)}}); }
    else { a = base; b = cloneScenario(base, {struct:{k:k, to:coldLevel(k)}}); }
    note = 'boundary: '+STRUCT[SIDX[k]].name+' hot vs cold inside a hot scenario';
  }
  if (Math.random()<0.5){ const t=a; a=b; b=t; }
  return {phase:'boundary', a:a, b:b, note:note};
}
/* discovery: novelty-biased — sample zero/low-coverage tags, far from his cluster */
function discoveryTrial(sess){
  const cov = sess.cov;
  const freshActs = ACTS.filter(a=>cov.tag[a]<=1);
  const freshCfg = CONFIGS.filter(c=>cov.tag[c]<=1);
  const cfg = freshCfg.length && Math.random()<0.6 ? rnd(freshCfg) : rnd(CONFIGS);
  const acts = [];
  const pool = coherentActs(cfg).filter(a=>coherentConfigForAct(a).includes(cfg));
  if (freshActs.length && Math.random()<0.7){
    const fa = rnd(freshActs.filter(a=>pool.includes(a)));
    if (fa) acts.push(fa);
  }
  while (acts.length<2 && pool.length){
    const a = pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    if (!acts.includes(a)) acts.push(a);
  }
  const sc = genScenario({config:cfg, acts:acts,
    intl: Math.random()<0.5?rnd(INTLS):null,
    fram: Math.random()<0.5?[rnd(FRAMS)]:[],
    struct: hotStruct(COHERENT[cfg])});
  const other = hotScenario();
  const swap = Math.random()<0.5;
  return {phase:'discover', a:swap?other:sc, b:swap?sc:other,
    note:'discovery: fresh combo ('+cfg+(acts.length?', '+acts.join('+'):'')+') vs home base'};
}
function nextTrial(sess){
  const n = sess.trials.length;
  if (n < PLAN.length){
    const p = PLAN[n];
    const t = {phase:p.phase, a:p.a(), b:p.b(), note:p.note, idx:n};
    if (Math.random()<0.5){ const x=t.a; t.a=t.b; t.b=x; }
    return t;
  }
  const np = n - PLAN.length;
  if (np < N_PROBE) return Object.assign(probeTrial(sess), {idx:n});
  if (np < N_PROBE+N_BOUND){
    if (!sess.fit || np===N_PROBE) fitSession(sess);
    return Object.assign(boundaryTrial(sess), {idx:n});
  }
  return Object.assign(discoveryTrial(sess), {idx:n});
}
</script>
<script>
'use strict';
/* ---------------- 6. ridge-penalized logistic (Bradley-Terry) ----------------
   P(pick A) = logistic((uA-uB)); rows = diffVec. Ridge centered on priors.
   Validated 2026-09-18 on synthetic data: recovered 4/4 factor rankings.   */
function fitBT(rows, ys, prior, lambda){
  lambda = lambda===undefined?4:lambda;
  const d = rows[0].length, n = rows.length;
  let w = prior.slice();
  for (let it=0; it<200; it++){
    const g = new Array(d).fill(0), H = [];
    for (let i=0;i<d;i++){ H.push(new Array(d).fill(0)); H[i][i]=lambda; }
    for (let r=0;r<n;r++){
      let z = 0; for (let j=0;j<d;j++) z += w[j]*rows[r][j];
      const p = 1/(1+Math.exp(-z)), y = ys[r];
      const s = p*(1-p);
      for (let j=0;j<d;j++) g[j] += (p-y)*rows[r][j];
      for (let j=0;j<d;j++) for (let k=0;k<d;k++) H[j][k] += s*rows[r][j]*rows[r][k];
    }
    for (let j=0;j<d;j++) g[j] += lambda*(w[j]-prior[j]);
    // solve H*delta = g via Gauss-Jordan
    const A = H.map((row,i)=>row.concat([g[i]]));
    for (let col=0; col<d; col++){
      let piv = col;
      for (let r2=col+1;r2<d;r2++) if (Math.abs(A[r2][col])>Math.abs(A[piv][col])) piv=r2;
      const tmp=A[col]; A[col]=A[piv]; A[piv]=tmp;
      const pv = A[col][col] || 1e-9;
      for (let r2=0;r2<d;r2++){
        if (r2===col) continue;
        const f = A[r2][col]/pv;
        if (f!==0) for (let c2=col;c2<=d;c2++) A[r2][c2]-=f*A[col][c2];
      }
    }
    let maxStep = 0;
    for (let j=0;j<d;j++){ const step = A[j][d]/(A[j][j]||1e-9); w[j]-=step; maxStep=Math.max(maxStep,Math.abs(step)); }
    if (maxStep<1e-7) break;
  }
  // SEs from final Hessian diagonal
  const H = [];
  for (let i=0;i<d;i++){ H.push(new Array(d).fill(0)); H[i][i]=lambda; }
  for (let r=0;r<n;r++){
    let z=0; for(let j=0;j<d;j++) z+=w[j]*rows[r][j];
    const s=(1/(1+Math.exp(-z)))*(1-1/(1+Math.exp(-z)));
    for (let j=0;j<d;j++) for (let k=0;k<d;k++) H[j][k]+=s*rows[r][j]*rows[r][k];
  }
  const A = H.map((row,i)=>row.map((v,j)=>j===i?v:row[j]).concat(new Array(d).fill(0).map((_,j)=>j===i?1:0)));
  for (let col=0; col<d; col++){
    let piv=col; for(let r2=col+1;r2<d;r2++) if(Math.abs(A[r2][col])>Math.abs(A[piv][col])) piv=r2;
    const tmp=A[col]; A[col]=A[piv]; A[piv]=tmp;
    const pv=A[col][col]||1e-9;
    for(let c2=0;c2<2*d;c2++) A[col][c2]/=pv;
    for(let r2=0;r2<d;r2++){ if(r2===col) continue; const f=A[r2][col];
      for(let c2=0;c2<2*d;c2++) A[r2][c2]-=f*A[col][c2]; }
  }
  const se = []; for (let j=0;j<d;j++) se.push(Math.sqrt(Math.max(A[j][d+j],0)));
  // McFadden pseudo-R2
  let ll=0, ll0=0;
  for (let r=0;r<n;r++){
    let z=0; for(let j=0;j<d;j++) z+=w[j]*rows[r][j];
    const p=1/(1+Math.exp(-z));
    ll += ys[r]*Math.log(p+1e-12)+(1-ys[r])*Math.log(1-p+1e-12);
    ll0 += ys[r]*Math.log(0.5)+(1-ys[r])*Math.log(0.5);
  }
  return {w:w, se:se, r2:1-ll/ll0, n:n};
}
function fitSession(sess){
  const rows = [], ys = [];
  sess.trials.forEach(t=>{
    if (t.resp==='skip') return;
    rows.push(diffVec(t.a, t.b));
    ys.push(t.resp==='A'?1:0);
  });
  if (!rows.length) return null;
  sess.fit = fitBT(rows, ys, priorVec(), 4);
  return sess.fit;
}

/* ---------------- 7. veto + boundary + novelty analysis ---------------- */
function analyzeVetoes(sess){
  // a tag is a veto candidate if: picked against whenever present AND "neither" veto used
  const veto = {};
  MENU.forEach(m=>{ if(m.c!=='config') veto[m.t]={picked:0, shown:0, neither:0}; });
  sess.trials.forEach(t=>{
    ['a','b'].forEach(side=>{
      const other = side==='a'?'b':'a';
      Object.keys(t[side].tags).forEach(tag=>{
        if (!veto[tag]) return;
        veto[tag].shown++;
        if (t.resp===side.toUpperCase()) veto[tag].picked++;
        if (t.resp==='neither') veto[tag].neither++;
      });
    });
  });
  const out = [];
  Object.keys(veto).forEach(tag=>{
    const v = veto[tag];
    if (v.shown>=3 && v.picked===0 && (v.neither>=2 || v.shown>=5))
      out.push({tag:tag, shown:v.shown, neither:v.neither});
  });
  return out;
}
function analyzeNovelty(sess){
  // discovery-phase trials he picked: novelty hits
  const hits = [];
  sess.trials.forEach(t=>{
    if (t.phase!=='discover' || !t.resp || t.resp==='skip') return;
    const picked = t.resp==='A'?t.a:t.b;
    const fresh = Object.keys(picked.tags).filter(tag=>sess.cov0 && (sess.cov0.tag[tag]||0)<=1);
    if (fresh.length) hits.push({trial:t.idx, picked:t.resp,
      fresh:fresh.map(f=>TAG[f].label).join(', '), config:picked.config});
  });
  return hits;
}

/* ---------------- 8. session + persistence ---------------- */
const LSKEY = 'scenario_lab_v1';
function newSession(){
  return {started:Date.now(), trials:[], cov:newCoverage(), cov0:null, fit:null, done:false};
}
function save(sess){ try{ localStorage.setItem(LSKEY, JSON.stringify(sess)); }catch(e){} }
function load(){
  try{ const s = localStorage.getItem(LSKEY); return s?JSON.parse(s):null; }catch(e){ return null; }
}
function recordResponse(sess, trial, resp){
  trial.resp = resp;
  sess.trials.push(trial);
  coverScenario(sess.cov, trial.a, 1);
  coverScenario(sess.cov, trial.b, 1);
  if (sess.trials.length===PLAN.length){
    sess.cov0 = JSON.parse(JSON.stringify(sess.cov)); // baseline cluster for novelty
  }
  if (sess.trials.length%3===0) fitSession(sess);
  save(sess);
}

/* ---------------- 9. UI ---------------- */
const app = (typeof document!=='undefined' && document.getElementById) ? document.getElementById('app') : null;
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function hud(sess, trial){
  const n = trial.trial, total = trialCount();
  return '<header class="hud"><h1>SCENARIO LAB <span class="dim">/ psychometric instrument</span></h1>'+
    '<div class="sub">vocabulary: <span class="menu">Pornhub /categories</span> menu · forced choice · Bradley–Terry fit</div>'+
    '<div id="prog"><div style="width:'+Math.round(100*n/total)+'%"></div></div>'+
    '<div id="progText"><span>trial '+(n+1)+' of '+total+'</span><span>'+trial.phase+'</span></div></header>';
}
function cardHTML(sc, side, novelTags){
  const tags = [];
  const fr = sc.fram.map(f=>'<span class="tg">'+esc(TAG[f].label)+'</span>').join('');
  if (sc.set) tags.push('<span class="tg">'+esc(TAG[sc.set].label)+'</span>');
  const cfgCls = 'tg cfg' + (novelTags&&novelTags.includes(sc.config)?' new':'');
  tags.push('<span class="'+cfgCls+'">'+esc(TAG[sc.config].label)+'</span>');
  sc.acts.forEach(a=>{
    const nv = novelTags&&novelTags.includes(a)?' new':'';
    tags.push('<span class="tg'+nv+'">'+esc(TAG[a].label)+'</span>');
  });
  if (sc.intl) tags.push('<span class="tg'+(novelTags&&novelTags.includes(sc.intl)?' new':'')+'">'+esc(TAG[sc.intl].label)+'</span>');
  const lines = sc.lines.map(l=>'<div class="bl">'+l.html+'</div>').join('');
  return '<button class="card" data-side="'+side+'"><div class="tags">'+fr+tags.join('')+'</div>'+lines+'</button>';
}
function novelTags(sess){
  if (!sess.cov0) return [];
  return Object.keys(sess.cov0.tag).filter(t=>(sess.cov0.tag[t]||0)<=1);
}
function showIntro(sess){
  app.innerHTML =
    '<header class="hud"><h1>SCENARIO LAB <span class="dim">/ psychometric instrument</span></h1>'+
    '<div class="sub">vocabulary: <span class="menu">Pornhub /categories</span> menu · '+
    'forced choice · no 1–10 ratings · Bradley–Terry part-worths</div></header>'+
    '<p>You\'ll see <b>'+trialCount()+'</b> pairs. Pick the one that does it for you more. '+
    'That\'s the whole test — one tap per screen.</p>'+
    '<p class="note">The scenarios are built from a real tube site\'s category menu — '+
    'the same vocabulary as the search bar, not a lab\'s guess at it. '+
    'Categories are 18+ fantasy; everybody in every scenario is an adult.</p>'+
    '<p class="note"><b>"Want neither"</b> = both are dead to you. Use it when you mean it — '+
    'that\'s how the instrument finds hard vetoes. <b>Skip</b> = unclear, don\'t count it.</p>'+
    (sess && sess.trials.length ?
      '<button class="btn" id="resume">RESUME — trial '+(sess.trials.length+1)+'</button>'+
      '<button class="btn ghost" id="restart">start over</button>' :
      '<button class="btn" id="start">START</button>');
  const go = ()=>{ if(!sess||!sess.trials.length) sess=newSession(); showTrial(sess); };
  const b = document.getElementById(sess&&sess.trials.length?'resume':'start');
  if (b) b.onclick = go;
  const rs = document.getElementById('restart');
  if (rs) rs.onclick = ()=>{ sess=newSession(); save(sess); showTrial(sess); };
}
function showTrial(sess){
  const trial = nextTrial(sess);
  trial.trial = sess.trials.length;
  const nv = novelTags(sess);
  app.innerHTML = hud(sess, trial)+
    '<div class="phase">'+esc(trial.phase.toUpperCase())+'</div>'+
    '<div class="q">Which one does it for you more?</div>'+
    cardHTML(trial.a,'A',nv)+cardHTML(trial.b,'B',nv)+
    '<div class="row3"><button id="neither">want neither</button>'+
    '<button id="skip">skip</button>'+
    '<button id="end">finish early</button></div>';
  app.querySelectorAll('.card').forEach(c=>{
    c.onclick = ()=>{ recordResponse(sess, trial, c.dataset.side);
      sess.trials.length>=trialCount() ? finish(sess) : showTrial(sess); };
  });
  document.getElementById('neither').onclick = ()=>{ recordResponse(sess, trial, 'neither');
    sess.trials.length>=trialCount() ? finish(sess) : showTrial(sess); };
  document.getElementById('skip').onclick = ()=>{ recordResponse(sess, trial, 'skip');
    sess.trials.length>=trialCount() ? finish(sess) : showTrial(sess); };
  document.getElementById('end').onclick = ()=>{ if (sess.trials.length>=15) finish(sess); };
}
function fmtW(w, se){
  const cls = w<0?'neg':'';
  const z = Math.abs(w)/se;
  const tier = z>1.96 ? '' : (z>1 ? ' · likely' : ' · unresolved');
  return '<span class="w '+cls+'">'+(w>=0?'+':'')+w.toFixed(2)+'</span> '+
    '<span class="se">±'+se.toFixed(2)+tier+'</span>';
}
function finish(sess){
  sess.done = true; fitSession(sess); save(sess);
  const fit = sess.fit, vetoes = analyzeVetoes(sess), hits = analyzeNovelty(sess);
  const usable = sess.trials.filter(t=>t.resp!=='skip').length;
  // rank tags by weight
  const tagRows = [];
  DIMS.forEach((d,i)=>{
    if (d.kind==='cfg' && d.key===CFG_REF) return;
    tagRows.push({label:d.label, kind:d.kind, w:fit.w[i], se:fit.se[i]});
  });
  tagRows.sort((a,b)=>b.w-a.w);
  const KINDN = {cfg:'CONFIG', act:'ACT', intl:'INTENSITY', fram:'FRAMING', set:'SETTING', st:'STRUCT'};
  let h = '<header class="hud"><h1>SCENARIO LAB <span class="dim">/ results</span></h1>'+
    '<div class="sub">'+usable+' usable trials · pseudo-R² '+fit.r2.toFixed(2)+
    ' · config weights relative to MMF baseline</div></header>';
  if (fit.r2 < 0.05)
    h += '<p class="note" style="border:1px solid var(--gold);border-radius:10px;padding:12px 14px;">'+
      'Heads up: your picks weren\'t well predicted by the menu dimensions (R² ≈ '+fit.r2.toFixed(2)+'). '+
      'That means the choices were inconsistent, or what moves you lives outside this tag set — '+
      'either way, treat the weights below as suggestive, not settled.</p>';
  h += '<h3 class="sec">TAG PART-WORTHS (β ± SE, ridge-penalized)</h3>';
  let lastKind = null;
  tagRows.forEach(r=>{
    if (r.kind!==lastKind){ h+='<div class="note" style="margin-top:12px;color:var(--gold)">'+KINDN[r.kind]+'</div>'; lastKind=r.kind; }
    const cls = r.w<0?'neg':'';
    const pw = Math.abs(r.w)/ (Math.max(...tagRows.map(x=>Math.abs(x.w)))||1);
    h += '<div class="trow"><div class="nm"><span>'+esc(r.label)+'</span>'+fmtW(r.w,r.se)+'</div>'+
      '<div class="tr"><div class="fl '+cls+'" style="left:'+(r.w<0?(50-50*pw):50)+'%;width:'+(50*pw)+'%"></div></div></div>';
  });
  h += '<h3 class="sec">HARD VETOES</h3>';
  if (vetoes.length) vetoes.forEach(v=>{
    h += '<div class="vetoBox"><b>VETO: '+esc(TAG[v.tag].label)+'</b> — picked 0 of '+v.shown+
      ' times shown'+(v.neither?', "want neither" used '+v.neither+'×':'')+'.</div>';
  });
  else h += '<p class="note">None established. Nothing you saw got a hard no.</p>';
  h += '<h3 class="sec">NOVELTY HITS (discovery phase picks)</h3>';
  if (hits.length) hits.forEach(x=>{
    h += '<div class="hitBox"><b>'+esc(x.fresh)+'</b> — picked in a discovery trial '+
      '(config: '+esc(x.config)+'). The menu found something new.</div>';
  });
  else h += '<p class="note">None. Everything new you were shown lost to home base.</p>';
  h += '<h3 class="sec">READOUT</h3>';
  const est = tagRows.filter(r=>Math.abs(r.w)>1.96*r.se);
  const lik = tagRows.filter(r=>{const z=Math.abs(r.w)/r.se; return z>1 && z<=1.96;});
  const drv = a=>a.filter(r=>r.w>0).map(r=>r.label);
  const rep = a=>a.filter(r=>r.w<0).map(r=>r.label);
  h += '<p class="note"><b>Established</b> (|β|&gt;1.96·SE) drivers: <b>'+
    esc(drv(est).slice(0,5).join(' · ')||'none yet')+'</b><br>'+
    'Established repellents: <b>'+esc(rep(est).slice(0,5).join(' · ')||'none yet')+'</b><br>'+
    '<b>Likely</b> (|β|&gt;SE) drivers: '+esc(drv(lik).slice(0,6).join(' · ')||'—')+'<br>'+
    'Likely repellents: '+esc(rep(lik).slice(0,6).join(' · ')||'—')+'<br>'+
    'Everything else is unresolved at '+usable+' trials — the SE is bigger than the estimate. '+
    'Run it again and the likely tier firms up.</p>';
  h += '<h3 class="sec">EXPORT</h3><button class="btn" id="exp">COPY scenario_instrument/v1 JSON</button>'+
    '<pre class="exp" id="expv" style="display:none"></pre>'+
    '<button class="btn ghost" id="again">run it again</button>';
  app.innerHTML = h;
  document.getElementById('exp').onclick = ()=>{
    const j = buildExport(sess);
    const v = document.getElementById('expv');
    v.style.display='block'; v.textContent = JSON.stringify(j, null, 1);
    if (navigator.clipboard) navigator.clipboard.writeText(JSON.stringify(j));
  };
  document.getElementById('again').onclick = ()=>{
    const s = newSession(); save(s); showTrial(s);
  };
}
function buildExport(sess){
  const fit = sess.fit;
  const partworths = {};
  DIMS.forEach((d,i)=>{ partworths[d.kind+':'+d.key] = {label:d.label, beta:+fit.w[i].toFixed(4), se:+fit.se[i].toFixed(4)}; });
  return {
    instrument:'scenario_instrument/v1', exported:new Date().toISOString(),
    vocabulary:{grounding:'Pornhub /categories taxonomy (96 categories, observed 2026-06-27)',
      note:'config/act/intensity/framing/setting tags map to ph category ids; structural layer is lab-built from scenario-ratings v1'},
    session:{started:new Date(sess.started).toISOString(),
      trials:sess.trials.length,
      usable:sess.trials.filter(t=>t.resp!=='skip').length,
      neither:sess.trials.filter(t=>t.resp==='neither').length,
      skipped:sess.trials.filter(t=>t.resp==='skip').length},
    fit:{pseudo_r2:+fit.r2.toFixed(4), lambda:4, config_reference:CFG_REF,
      partworths:partworths},
    vetoes:analyzeVetoes(sess),
    novelty_hits:analyzeNovelty(sess),
    trials:sess.trials.map(t=>({idx:t.idx, phase:t.phase, resp:t.resp,
      a:{config:t.a.config, acts:t.a.acts, intl:t.a.intl, fram:t.a.fram, set:t.a.set, struct:t.a.struct},
      b:{config:t.b.config, acts:t.b.acts, intl:t.b.intl, fram:t.b.fram, set:t.b.set, struct:t.b.struct}})),
  };
}
