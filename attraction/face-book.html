<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FACEBOOK — a book of faces</title>
<style>
  :root { --bg:#0d0f14; --panel:#151924; --ink:#e8e6e1; --dim:#8b93a7; --accent:#7dd3fc; --chip:#1e2433; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:28px 20px 12px; text-align:center; }
  header h1 { margin:0; font-size:clamp(28px,6vw,52px); letter-spacing:.14em; font-weight:800; }
  header h1 .book { color:var(--accent); }
  header p { margin:8px 0 0; color:var(--dim); font-size:14px; }
  header p b { color:var(--ink); }
  #controls { position:sticky; top:0; z-index:5; background:rgba(13,15,20,.94); backdrop-filter:blur(6px);
    padding:12px 16px; border-bottom:1px solid #222a3d; }
  #controls .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; }
  .chip { background:var(--chip); color:var(--ink); border:1px solid #2a3350; border-radius:999px;
    padding:6px 14px; font-size:13px; cursor:pointer; user-select:none; }
  .chip.on { background:var(--accent); color:#0d0f14; border-color:var(--accent); font-weight:700; }
  .chip.ghost { opacity:.55; }
  #q { background:var(--chip); color:var(--ink); border:1px solid #2a3350; border-radius:999px;
    padding:7px 14px; font-size:13px; width:min(280px, 70vw); outline:none; }
  #count { text-align:center; color:var(--dim); font-size:12.5px; padding:10px 0 2px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px; padding:14px 16px 60px; max-width:1400px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid #222a3d; border-radius:10px; overflow:hidden; cursor:pointer; transition:transform .12s ease; }
  .card:hover { transform:translateY(-2px); border-color:var(--accent); }
  .card img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#0a0c10; }
  .card .meta { padding:7px 9px 9px; }
  .card .id { font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .tags { font-size:11px; color:var(--dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #lightbox { position:fixed; inset:0; background:rgba(5,6,10,.92); display:none; align-items:center; justify-content:center; z-index:20; padding:20px; }
  #lightbox.open { display:flex; }
  #lightbox .box { background:var(--panel); border:1px solid #2a3350; border-radius:14px; max-width:min(860px,96vw);
    max-height:94vh; overflow:auto; display:flex; flex-wrap:wrap; }
  #lightbox img { width:min(420px,100%); height:auto; object-fit:cover; background:#000; }
  #lightbox .info { padding:22px; min-width:240px; flex:1; }
  #lightbox .info h2 { margin:0 0 4px; font-size:22px; }
  #lightbox .info .sub { color:var(--dim); font-size:13px; margin-bottom:14px; }
  #lightbox table { border-collapse:collapse; font-size:13.5px; width:100%; }
  #lightbox td { padding:6px 8px 6px 0; vertical-align:top; }
  #lightbox td.k { color:var(--dim); width:96px; }
  #lightbox .close { position:absolute; top:14px; right:18px; font-size:30px; color:var(--dim); cursor:pointer; background:none; border:none; }
  #lightbox .close:hover { color:var(--ink); }
  #empty { text-align:center; color:var(--dim); padding:60px 20px; display:none; }
</style>
</head>
<body>
<header>
  <h1>FACE<span class="book">BOOK</span></h1>
  <p>a book of faces · <b id="total">…</b> entries · every one synthetic, every one judged</p>
  <p style="margin:10px 0 0"><a href="index.html" style="color:var(--dim);font-size:13px;text-decoration:none">← instruments</a></p>
</header>
<div id="controls">
  <div class="row" id="groupChips"></div>
  <div class="row" style="margin-top:8px">
    <label for="fBackground" style="font-size:12px;color:var(--dim);align-self:center">background
      <select id="fBackground" style="margin-left:6px;background:var(--panel);color:var(--ink);border:1px solid #2a3350;border-radius:8px;padding:5px 8px;font-size:12.5px"></select>
    </label>
    <span class="chip on" data-phase="all">all phases</span>
    <span class="chip" data-phase="1">phase 1</span>
    <span class="chip" data-phase="2">phase 2</span>
    <input id="q" type="search" placeholder="search id · label · subgroup…" autocomplete="off">
  </div>
</div>
<div id="count"></div>
<div id="grid"></div>
<div id="empty">no faces match. the book remains unwritten on this page.</div>

<div id="lightbox">
  <button class="close" id="lbClose" aria-label="close">×</button>
  <div class="box">
    <img id="lbImg" alt="">
    <div class="info">
      <h2 id="lbId"></h2>
      <div class="sub" id="lbLabel"></div>
      <table id="lbTable"></table>
    </div>
  </div>
</div>

<script>
const THUMB = id => 'faces/thumbs/' + id + '.webp';
const FULL  = id => 'faces/' + id + '.webp';
let FACES = [], fGroup = 'all', fPhase = 'all', fQ = '';

function chipRow(el, items, cur, cb) {
  el.innerHTML = '';
  items.forEach(([val, label]) => {
    const s = document.createElement('span');
    s.className = 'chip' + (val === cur ? ' on' : '');
    s.textContent = label;
    s.onclick = () => cb(val);
    el.appendChild(s);
  });
}

function render() {
  const q = fQ.trim().toLowerCase();
  const list = FACES.filter(f => {
    if (fGroup !== 'all' && f.group !== fGroup) return false;
    if (fPhase !== 'all' && String(f.phase) !== fPhase) return false;
    if (q && !((f.id + ' ' + (f.label||'') + ' ' + (f.subgroup||'') + ' ' + (f.archetype||'')).toLowerCase().includes(q))) return false;
    return true;
  });
  document.getElementById('count').textContent = `showing ${list.length} of ${FACES.length}`;
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  const g = document.getElementById('grid');
  g.innerHTML = '';
  const frag = document.createDocumentFragment();
  list.forEach(f => {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `<img loading="lazy" decoding="async" src="${THUMB(f.id)}" alt="${f.id}">
      <div class="meta"><div class="id">${f.id}</div>
      <div class="tags">${f.group || ''} · ${f.subgroup || ''} · p${f.phase}</div></div>`;
    d.onclick = () => openLB(f);
    frag.appendChild(d);
  });
  g.appendChild(frag);
}

function openLB(f) {
  document.getElementById('lbImg').src = FULL(f.id);
  document.getElementById('lbId').textContent = f.id;
  document.getElementById('lbLabel').textContent = f.label || '';
  const rows = [['background', f.group], ['subgroup', f.subgroup], ['sex', f.sex],
    ['phase', f.phase], ['archetype', f.archetype], ['label', f.label]]
    .filter(([,v]) => v !== undefined && v !== null && v !== '')
    .map(([k,v]) => `<tr><td class="k">${k}</td><td>${v}</td></tr>`).join('');
  document.getElementById('lbTable').innerHTML = rows;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lbClose').onclick = () =>
  document.getElementById('lightbox').classList.remove('open');
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target.id === 'lightbox') e.target.classList.remove('open');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});

fetch('faces/faces.json').then(r => r.json()).then(d => {
  FACES = d.faces || d;
  document.getElementById('total').textContent = FACES.length;
  const groups = ['all', ...new Set(FACES.map(f => f.group).filter(Boolean))].sort((a,b)=>a==='all'?-1:b==='all'?1:a.localeCompare(b));
  const counts = {};
  FACES.forEach(f => counts[f.group] = (counts[f.group]||0)+1);
  function paintGroups() {
    chipRow(document.getElementById('groupChips'),
      groups.map(g => [g, g === 'all' ? `all (${FACES.length})` : `${g} (${counts[g]})`]),
      fGroup, v => { fGroup = v; paintGroups(); render(); });
    // the background <select> mirrors the same fGroup filter, both directions
    const sel = document.getElementById('fBackground');
    sel.innerHTML = groups.map(g =>
      `<option value="${g}">${g === 'all' ? `all backgrounds (${FACES.length})` : `${g} (${counts[g]})`}</option>`).join('');
    sel.value = fGroup;
    sel.onchange = () => { fGroup = sel.value; paintGroups(); render(); };
  }
  paintGroups();
  render();
}).catch(() => {
  document.getElementById('empty').style.display = 'block';
  document.getElementById('empty').textContent = 'could not load faces/faces.json';
});

function syncPhaseChips() {
  document.querySelectorAll('[data-phase]').forEach(c =>
    c.classList.toggle('on', c.dataset.phase === fPhase));
}
document.querySelectorAll('[data-phase]').forEach(c =>
  c.onclick = () => { fPhase = c.dataset.phase; syncPhaseChips(); render(); });
document.getElementById('q').addEventListener('input', e => { fQ = e.target.value; render(); });
</script>
</body>
</html>
