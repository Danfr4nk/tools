<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>age pipeline diag (temporary)</title>
<style>body{background:#111;color:#0f0;font:13px monospace;padding:16px;white-space:pre-wrap}</style>
</head><body>
<div id="status">BOOT</div>
<div id="err" style="color:#f66"></div>
<div id="out"></div>
<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1';
const $ = id => document.getElementById(id);
const log = t => { $('out').textContent += t + '\n'; };
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mk(seed, mode){
  const c=document.createElement('canvas');c.width=c.height=224;
  const x=c.getContext('2d');
  if(mode==='noise'){const d=x.createImageData(224,224),r=mulberry(seed);
    for(let i=0;i<d.data.length;i+=4){d.data[i]=r()*255;d.data[i+1]=r()*255;d.data[i+2]=r()*255;d.data[i+3]=255;}
    x.putImageData(d,0,0);}
  else{ // crude face-ish: skin ellipse on dark bg, variant by seed
    x.fillStyle='#14100c';x.fillRect(0,0,224,224);
    x.fillStyle=seed%2?'#c8956c':'#8a5a3b';
    x.beginPath();x.ellipse(112,112,70,90,0,0,7);x.fill();
    x.fillStyle='#1a0f08';
    x.beginPath();x.ellipse(88,95,10,7,0,0,7);x.fill();
    x.beginPath();x.ellipse(136,95,10,7,0,0,7);x.fill();
  }
  return c;
}
const LABELS=['0-2','3-9','10-19','20-29','30-39','40-49','50-59','60-69','more than 70'];
const MID=[1,6,14.5,24.5,34.5,44.5,54.5,64.5,78];
try{
  $('status').textContent='LOADING MODEL…';
  const clf=await pipeline('image-classification','onnx-community/fairface_age_image_detection-ONNX',{dtype:'q4f16'});
  $('status').textContent='RUNNING';
  const tests=[['noise1',mk(1,'noise')],['noise2',mk(2,'noise')],['faceA',mk(3,'face')],['faceB',mk(4,'face')]];
  const seen=new Set();
  for(const [name,cv] of tests){
    const out=await clf(cv,{top_k:9});
    const m={};for(const r of out)m[r.label]=r.score;
    const probs=LABELS.map(l=>m[l]||0);
    const exp=probs.reduce((s,p,i)=>s+p*MID[i],0);
    const top=out[0];
    const key=exp.toFixed(2)+'|'+probs.map(p=>p.toFixed(4)).join(',');
    seen.add(key);
    log(name+': n_results='+out.length+' expected='+exp.toFixed(1)+' top='+top.label+'@'+top.score.toFixed(3));
    log('  labels: '+out.map(r=>r.label).join(','));
  }
  log('UNIQUE OUTPUTS: '+seen.size+'/4 '+(seen.size>1?'(VARIES — pipeline fine)':'(CONSTANT — pipeline bug)'));
}catch(e){$('err').textContent='FAILED: '+(e&&e.message||e);}
$('status').textContent='DONE';
</script>
</body></html>
